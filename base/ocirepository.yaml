# The chart digest is set per tier by tiers/<tier>/release.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: otel-collector
  namespace: otel-collector
spec:
  interval: 5m
  url: oci://ghcr.io/twallac10/charts/promo-otel-collector
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
