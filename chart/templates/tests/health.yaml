apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-health
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: {{ .Values.promoTest.image }}
      command: [sh, -c]
      args:
        - |
          for i in $(seq 1 30); do
            curl -fsS http://{{ .Values.promoTest.host }}:13133/ && { echo; echo "PASS: healthy"; exit 0; }
            echo "attempt $i"; sleep 3
          done
          echo "FAIL: health endpoint"; exit 1
