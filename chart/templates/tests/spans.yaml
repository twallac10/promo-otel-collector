{{- /* Send one span over OTLP/HTTP and require the collector to count it as accepted. */}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-spans
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: {{ .Values.promoTest.image }}
      command: [sh, -c]
      args:
        - |
          span='{"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"promo-helm-test"}}]},"scopeSpans":[{"spans":[{"traceId":"5b8efff798038103d269b633813fc60c","spanId":"eee19b7ec3c1b174","name":"promo-helm-test","kind":1,"startTimeUnixNano":"1","endTimeUnixNano":"2"}]}]}]}'
          for i in $(seq 1 30); do
            curl -fsS -H 'Content-Type: application/json' -d "$span" http://{{ .Values.promoTest.host }}:4318/v1/traces >/dev/null || { echo "attempt $i: send failed"; sleep 3; continue; }
            n=$(curl -fsS http://{{ .Values.promoTest.host }}:8888/metrics | grep '^otelcol_receiver_accepted_spans' | grep -v ' 0$' | head -1)
            [ -n "$n" ] && { echo "PASS: $n"; exit 0; }
            echo "attempt $i: no accepted spans yet"; sleep 3
          done
          echo "FAIL: accepted-spans metric missing or zero"; exit 1
