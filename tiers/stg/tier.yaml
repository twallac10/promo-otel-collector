# TIER-ONLY (stg): never promoted. Replicas, retention, enforcement mode, remediation.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: otel-collector
spec:
  upgrade:
    # onFailure: rollback. A failed upgrade (including failed tests) is rolled back once.
    remediation:
      retries: 0
      remediateLastFailure: true
      strategy: rollback
  values:
    behaviour:
      tier: stg
